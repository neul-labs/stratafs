[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratafs"
dynamic = ["version"]
description = "StrataFS - A local, offline hybrid-RAG (BM25 + vector + metadata) search server for AI agents, with a native MCP server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Neul Labs", email = "contact@neullabs.com"},
]
keywords = [
    "stratafs",
    "rag",
    "hybrid-search",
    "hybrid-rag",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "bm25",
    "vector-search",
    "semantic-search",
    "offline-search",
    "local-first",
    "embeddings",
    "ai-agents",
    "ai",
    "search",
    "filesystem",
    "semantic-filesystem",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://stratafs.neullabs.com"
Documentation = "https://docs.neullabs.com/stratafs"
Repository = "https://github.com/neul-labs/stratafs"
Issues = "https://github.com/neul-labs/stratafs/issues"

[project.scripts]
stratafs = "stratafs.cli:main"

[tool.setuptools.dynamic]
version = {attr = "stratafs.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["stratafs*"]
